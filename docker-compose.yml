services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"message\":\"ok\"' || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    init: true

    ports:
      - "3000:3000"

    restart: unless-stopped
