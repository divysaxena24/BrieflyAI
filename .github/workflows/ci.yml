name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      NODE_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Dependency Tree
        run: npm ls --depth=0

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Next.js Application
        run: npm run build

      - name: Verify Docker Compose
        run: |
          if [ -f docker-compose.yml ] || [ -f compose.yml ]; then
            docker compose config
          else
            echo "No Docker Compose file found. Skipping."
          fi

      - name: Build Docker Image
        run: |
          if [ -f docker-compose.yml ] || [ -f compose.yml ]; then
            docker compose build
          else
            echo "No Docker Compose file found. Skipping."
          fi

      - name: Cache Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            npm-debug.log*
            yarn-error.log*
            pnpm-debug.log*